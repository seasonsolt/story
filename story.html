  .ux-btn:hover .btn-vis, .ux-btn:focus-visible .btn-vis { transform: scale(1.06); filter: drop-shadow(0 0 12px rgba(255, 224, 150, .88)); }

/* Pure state machine for 冰雪故事小导演 (<script id="logic">). Zero DOM access; runs in Node tests and browser. */
const IDLE_HINT_SEC = 14;

function createGame() {
  const g = {
    state: 'title',     // 'title' | 'play' | 'clear' | 'win'
    index: 0,
    phase: 'build',     // 'build' | 'studio'
    time: 0,
    idleTime: 0,
    hintCard: '',
    assistCard: '',
    misses: 0,
    slots: [],          // chosen card IDs in current structure / active puzzle
    stepIdx: 0,         // build cursor
    puzzleIdx: 0,       // for multi-puzzle reason rooms
    demoHeard: false,
    recorded: false,
    studioPlayed: false,
    heroes: {
      elsa: { state: 'idle', cheer: 0 },
      anna: { state: 'idle', cheer: 0 },
      olaf: { state: 'idle', cheer: 0 },
    },
    events: [],

    level() {
      return LEVELS[g.index];
    },

    emit(ev) {
      g.events.push(ev);
    },

    drain() {
      return g.events.splice(0, g.events.length);
    },

    load(i) {
      const idx = Math.max(0, Math.min(LEVELS.length - 1, i | 0));
      const lv = LEVELS[idx];
      g.index = idx;
      g.phase = 'build';
      g.time = 0;
      g.idleTime = 0;
      g.hintCard = '';
      g.assistCard = '';
      g.misses = 0;
      g.stepIdx = 0;
      g.puzzleIdx = 0;
      g.demoHeard = false;
      g.recorded = false;
      g.studioPlayed = false;
      const nSlots = lv.skill === 'sentence' ? 4 : (lv.skill === 'reason' ? 2 : 3);
      g.slots = new Array(nSlots).fill('');
      for (const k of ['elsa', 'anna', 'olaf']) {
        g.heroes[k] = { state: k === lv.host ? 'speak' : 'idle', cheer: 0 };
      }

    expectedCardId() {

        }

        g.heroes[lv.host].cheer = 1.4;
        g.emit({ type: 'studio_ready', skill: lv.skill, cards: g.studioCards() });
      }

    },

    markDemoHeard() {
      if (g.state !== 'play') return;
      g.demoHeard = true;
      g.resetIdle();
      g.emit({ type: 'demo_heard' });
    },

    markRecorded() {
      if (g.state !== 'play') return;

    },

    cheerHero(who) {
      if (!g.heroes[who]) return false;
      g.heroes[who].cheer = 1.1;
      g.emit({ type: 'cheer', who });
      return true;
    },

    completeRoom() {
      if (g.state !== 'play' || g.phase !== 'studio') return false;
      const last = g.index >= LEVELS.length - 1;
      g.state = last ? 'win' : 'clear';
      g.emit({ type: g.state, index: g.index, id: g.level().id, skill: g.level().skill });
      return true;
    },

    step(dt) {
      if (g.state !== 'play') return;
      const clamped = Math.min(0.05, Math.max(0, dt || 0));
      g.time += clamped;
      g.idleTime += clamped;
      for (const k of ['elsa', 'anna', 'olaf']) {
        const h = g.heroes[k];
        if (h.cheer > 0) h.cheer = Math.max(0, h.cheer - clamped);
      }
      if (!g.hintCard && g.phase === 'build' && g.idleTime >= IDLE_HINT_SEC) {
        g.hintCard = g.expectedCardId();
        if (g.hintCard) g.emit({ type: 'hint_auto', cardId: g.hintCard });
      }
    },
  };
  return g;
}

  function uxButton(o) {
    const r = Math.max(32, o.r || 36);

    const icCol = o.plate === 'gold' ? '#4a2605' : (o.plate === 'rec' ? '#ffffff' : '#1b2c5c');
    const cls = 'ux-btn' + (o.cls ? ' ' + o.cls : '');
    const pic = o.pic ? uxPic(o.pic, -r * .78, -r * .78, r * 1.56, r * 1.56) : uxIcon(o.icon || o.ui, r * .66, icCol);

      <circle r="${r}" fill="${fill}" stroke="${stroke}" stroke-width="3.5"/>${pic}</g></g>`;

  function uxNudge(node) {
    if (!node) return;

    node.classList.add('ux-shake');

  function uxBind(root, handlers) {
    if (!root) return;
    root.querySelectorAll('[data-act]').forEach(btn => {
      const act = btn.getAttribute('data-act'), ui = btn.getAttribute('data-ui');
      btn.addEventListener('pointerenter', () => { if (ui && typeof voice !== 'undefined') voice.ui(ui); });
      btn.addEventListener('focus', () => { if (ui && typeof voice !== 'undefined') voice.ui(ui); });
      btn.addEventListener('click', () => { if (handlers[act]) handlers[act](btn); });
      btn.addEventListener('keydown', /** @param {KeyboardEvent} e */ e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); if (handlers[act]) handlers[act](btn); } });
    });
  }

  function showStory(keys, done) {
    const s = uxScreen('story');

      if (!uxAlive(s)) return;
      const key = keys[idx];
      const root = uxPaint(`<g class="page">

        ${uxButton({ act: 'next', ui: 'next', icon: 'next', x: 886, y: 452, r: 38, plate: 'gold' })}
      </g>`);
      const next = () => {
        if (!uxAlive(s)) return;
        uxStopVoice();
        if (++idx < keys.length) render();
        else uxEnd(s, done);

      s.onKey = next;
      uxBind(root, { next });

  /* Responsive stage sizing, portrait pause check, keyboard arrows & gamepad focus navigation. */
  let fitRaf = 0;

  function applyFit() {
    fitRaf = 0;

    const cssW = layoutStageWidth(availW, availH);

  function fitStageSoon() { if (!fitRaf) fitRaf = requestAnimationFrame(applyFit); }
  window.addEventListener('resize', fitStageSoon);
  window.addEventListener('orientationchange', fitStageSoon);
  applyFit();

  function toggleFullscreen() {
    const doc = document, elRoot = document.documentElement;
    const active = doc.fullscreenElement || doc.webkitFullscreenElement;
    if (active) {
      if (doc.exitFullscreen) doc.exitFullscreen().catch(() => {});
      else if (doc.webkitExitFullscreen) doc.webkitExitFullscreen();
    } else {
      if (elRoot.requestFullscreen) elRoot.requestFullscreen().catch(() => {});
      else if (elRoot.webkitRequestFullscreen) elRoot.webkitRequestFullscreen();
    }
  }

  let padCur = -1, padLastMove = 0, padLastA = false, padLastB = false;

  function interactiveTargets() {
    const scope = uxState.modal ? $('modal') : storyIsOpen() ? $('overlay') : (game.phase === 'studio' ? $('studio') : $('cards'));
    if (!scope) return [];
    const nodes = [...scope.querySelectorAll('[role="button"]:not([data-state="lock"])')];
    return nodes.map(node => {
      const b = node.getBoundingClientRect();
      const s = $('stage').getBoundingClientRect();
      const k = s.width > 0 ? 960 / s.width : 1;
      return { node, pulse: node.classList.contains('ux-pulse'), x: (b.left - s.left) * k, y: (b.top - s.top) * k, w: b.width * k, h: b.height * k };
    }).filter(r => r.w > 10 && r.h > 10);
  }

  function showPadRing(r) {
    const pf = $('padFocus');
    if (!pf) return;
    if (!r) { pf.setAttribute('visibility', 'hidden'); return; }
    const rect = pf.querySelector('rect');
    rect.setAttribute('x', (r.x - 4).toFixed(1)); rect.setAttribute('y', (r.y - 4).toFixed(1));
    rect.setAttribute('width', (r.w + 8).toFixed(1)); rect.setAttribute('height', (r.h + 8).toFixed(1));
    pf.setAttribute('visibility', 'visible');
  }

  function movePadFocus(dir) {
    const list = interactiveTargets();
    if (!list.length) { showPadRing(null); return false; }
    if (padCur < 0 || padCur >= list.length) { padCur = layoutPadStart(list); showPadRing(list[padCur]); return true; }
    const next = layoutPadPick(dir, padCur, list);
    if (next >= 0) { padCur = next; showPadRing(list[padCur]); list[padCur].node.dispatchEvent(new Event('focus')); return true; }
    return false;
  }

  window.addEventListener('keydown', e => {
    if (uxState.modal) return;
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft' || e.key === 'ArrowUp' || e.key === 'ArrowDown') {
      const dir = e.key === 'ArrowRight' ? 'r' : e.key === 'ArrowLeft' ? 'l' : e.key === 'ArrowDown' ? 'd' : 'u';
      if (movePadFocus(dir)) e.preventDefault();
    } else if (e.key === 'Enter' || e.key === ' ') {
      const active = document.activeElement;
      if (active && $('stage').contains(active) && active instanceof HTMLElement) return;
      if (story && story.onKey) { e.preventDefault(); story.onKey(); }
    } else if (e.key === 'Escape' && story && story.name !== 'title' && story.name !== 'finale') {
      const back = $('overlay').querySelector('[data-act="back"]');
      if (back) back.dispatchEvent(new MouseEvent('click'));
    }
  });

  function padTick(now) {
    const pads = navigator.getGamepads ? navigator.getGamepads() : null;
    const p = pads && pads[0];
    if (!p) { if (!document.activeElement || document.activeElement === document.body) showPadRing(null); return; }
    const ax = p.axes[0] || 0, ay = p.axes[1] || 0;
    const l = (p.buttons[14] && p.buttons[14].pressed) || ax < -.5;
    const r = (p.buttons[15] && p.buttons[15].pressed) || ax > .5;
    const u = (p.buttons[12] && p.buttons[12].pressed) || ay < -.5;
    const d = (p.buttons[13] && p.buttons[13].pressed) || ay > .5;
    if ((l || r || u || d) && now - padLastMove > .22) { padLastMove = now; movePadFocus(r ? 'r' : l ? 'l' : d ? 'd' : 'u'); }
    const aPressed = !!(p.buttons[0] && p.buttons[0].pressed);
    if (aPressed && !padLastA) { const list = interactiveTargets(); if (padCur >= 0 && list[padCur]) list[padCur].node.dispatchEvent(new MouseEvent('click')); }
    padLastA = aPressed;
    const bPressed = !!(p.buttons[1] && p.buttons[1].pressed);
    if (bPressed && !padLastB) { const back = $('overlay').querySelector('[data-act="back"]'); if (back) back.dispatchEvent(new MouseEvent('click')); }
    padLastB = bPressed;
  }

  const playFlow = { phase: 'title', studioTimer: 0, studioNonce: 0 };

  function onCardPick(cid, btnNode) {
    if (!canPlay() || game.phase !== 'build') return;

    talkOnEvents(evs, game);
    if (!ok) {
      uxNudge(btnNode);
      speakCard(cid);
      renderStage(game, false);
      return;
    }
    const meta = CARD_META[cid];
    if (meta && meta.voiceKey && hasLineKey(meta.voiceKey) && game.phase === 'build') {
      voice.line(meta.voiceKey, { interrupt: true, tag: 'card', maxWait: 2000, subtitle: false });
    }
    uxConfetti($('fx'), 480, 210, 16);
    renderStage(game, false);
  }

  function runStudioCardWalk(count) {
    clearInterval(playFlow.studioTimer);
    let c = 0;
    highlightStudioCard(0);
    playFlow.studioTimer = setInterval(() => {
      if (game.state !== 'play' || game.phase !== 'studio' || storyIsOpen()) {
        clearInterval(playFlow.studioTimer);
        highlightStudioCard(-1);
        return;
      }
      c = (c + 1) % Math.max(1, count);
      highlightStudioCard(c);
    }, 1800);
  }

  function onStudioDemo() {
    if (!canPlay() || game.phase !== 'studio' || stageState.recording) return;
    unlockAudio();
    setMicMute(false);
    recorder.stopPlay();
    game.markDemoHeard();
    audioOnEvents(game.drain());
    const lv = game.level();
    const nonce = ++playFlow.studioNonce;
    runStudioCardWalk(game.studioCards().length);
    TK.say(lv.demoKey, { interrupt: true, tag: 'demo', maxWait: 10000 }).then(() => {
      if (nonce !== playFlow.studioNonce) return;
      clearInterval(playFlow.studioTimer);
      highlightStudioCard(-1);
      renderStage(game, true);
    });
  }

  async function onStudioMicToggle() {
    if (!canPlay() || game.phase !== 'studio') return;
    unlockAudio();
    const lv = game.level();
    const nonce = ++playFlow.studioNonce;

    if (stageState.recording) {
      clearInterval(playFlow.studioTimer);
      highlightStudioCard(-1);
      const res = await recorder.stop();
      stageState.recording = false;
      setMicMute(false);
      setStudioWaves(null);
      uxSfx('mic_stop');
      if (res && res.blob) {
        sessionClips.set(lv.id, res.blob);
        stageState.hasClip = true;
        await recorder.saveClip('room_' + lv.id, res.blob);
        save.recordingsCount = (save.recordingsCount || 0) + 1;
        saveWrite();
        game.markRecorded();
        audioOnEvents(game.drain());
        uxConfetti($('fx'), 480, 240, 32);
        stageState.idx = -1;
        renderStage(game, true);
        // Play back the child's own recording cleanly, then celebrate!
        setMicMute(true);
        recorder.play(res.blob, () => {
          setMicMute(false);
          if (nonce === playFlow.studioNonce && canPlay()) {
            TK.say('rec_done_' + (1 + Math.floor(Math.random() * 3)), { interrupt: true, maxWait: 5000 });
          }
        });
      } else {
        stageState.idx = -1;
        renderStage(game, true);
      }
      return;
    }

    recorder.stopPlay();
    setMicMute(true);
    const res = await recorder.start(
      bars => setStudioWaves(bars),
      () => { if (stageState.recording) onStudioMicToggle(); },
    );
    if (!res.ok) {
      setMicMute(false);
      stageState.recording = false;
      setStudioWaves(null);
      game.markDemoHeard();
      renderStage(game, true);
      runStudioCardWalk(game.studioCards().length);
      TK.say('mic_fallback', { interrupt: true, tag: 'demo', maxWait: 6000 }).then(() => {
        if (nonce === playFlow.studioNonce) TK.say(lv.demoKey, { tag: 'demo', maxWait: 9500 });
      });
      return;
    }
    stageState.recording = true;
    uxSfx('mic_start');
    stageState.idx = -1;
    renderStage(game, true);
    runStudioCardWalk(game.studioCards().length);
  }

  async function onStudioListen() {
    if (!canPlay() || game.phase !== 'studio' || stageState.recording) return;
    unlockAudio();
    const lv = game.level();
    let blob = sessionClips.get(lv.id);
    if (!blob) blob = await recorder.loadClip('room_' + lv.id);
    if (!blob) { onStudioDemo(); return; }
    sessionClips.set(lv.id, blob);
    setMicMute(true);
    runStudioCardWalk(game.studioCards().length);
    recorder.play(blob, () => {
      setMicMute(false);
      clearInterval(playFlow.studioTimer);
      highlightStudioCard(-1);
    });
  }

  function onStudioDone() {
    if (!canPlay() || game.phase !== 'studio') return;
    stopStudioPlayback();
    if (!game.completeRoom()) return;
    completeRoom(game.index);
  }

  function onHeroTap(who) {
    if (!canPlay() || !who) return;
    unlockAudio();
    game.cheerHero(who);
    uxConfetti($('fx'), who === heroDrawn.leftWho ? 110 : 850, 340, 14);
    const evs = game.drain();
    audioOnEvents(evs);
    talkOnEvents(evs, game);
  }

  function triggerHint() {
    if (!canPlay()) return;
    unlockAudio();
    if (game.phase === 'build') {
      game.hintCard = game.expectedCardId();
      uxSfx('tap');
      TK.say('idle_' + (1 + Math.floor(Math.random() * 3)), { interrupt: true, tag: 'hint', maxWait: 3500 });
    } else {
      onStudioDemo();
    }
  }

  function completeRoom(lvIdx) {
    const lv = LEVELS[lvIdx];
    playFlow.phase = 'clear';
    const stars = [true, !!(game.demoHeard || game.recorded), !!game.recorded];
    markRoom(lv.id, { cleared: true, recorded: !!game.recorded, stars });
    if (!save.skills) save.skills = { sequence: 0, sentence: 0, classify: 0, reason: 0 };
    save.skills[lv.skill] = Math.min(2, (save.skills[lv.skill] || 0) + 1);
    saveWrite();

    showClear(lvIdx, () => {
      if (lvIdx >= LEVELS.length - 1) showStory(['win', 'end'], () => showFinale(showTitle));
      else openRoom(lvIdx + 1);
    });
  }

  let lastT = performance.now(), secAcc = 0;
  function frame(now) {
    const dt = Math.min(.05, (now - lastT) / 1000);
    lastT = now;
    const tSec = now / 1000;
    if (canPlay()) {
      game.step(dt);
      const evs = game.drain();
      if (evs.length) { audioOnEvents(evs); talkOnEvents(evs, game); }
      renderHeroes(game, tSec);
      secAcc += dt;
      if (secAcc >= 1) { save.totalPlaySeconds += Math.floor(secAcc); secAcc %= 1; saveSoon(); }
    } else if (heroDrawn.built && game.state !== 'play') {
      renderHeroes(game, tSec);
    }
    fxTick(dt, tSec, game);
    audioTick();
    padTick(tSec);
    requestAnimationFrame(frame);
  }

  const titlePlan = assetPlan(LEVELS);
  const qaMode = DEV ? new URLSearchParams(location.search).get('qa') : null;
  if (DEV && qaMode === 'unlock') {
    save.unlocked.rooms = LEVELS.length;
    for (const lv of LEVELS) markRoom(lv.id, { cleared: true, recorded: true, stars: [true, true, true] });
    save.skills = { sequence: 2, sentence: 2, classify: 2, reason: 2 };
    save.recordingsCount = 4;
    save.freeSentences = 3;
  }

  loadArt(titlePlan.title, ART_PATIENCE).then(() => {
    registerOfflineWorker();
    if (DEV && qaMode === 'win') {
      save.unlocked.rooms = LEVELS.length;
      for (const lv of LEVELS) markRoom(lv.id, { cleared: true, recorded: true, stars: [true, true, true] });
      save.skills = { sequence: 2, sentence: 2, classify: 2, reason: 2 };
      showStory(['win', 'end'], () => showFinale(showTitle));
    } else {
      showTitle();
    }
    requestAnimationFrame(frame);
  });
})();
</script>
</body>
</html>
