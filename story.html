<style>

  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; background: var(--night); color: var(--cream); overflow: hidden;
    font-family: "ZCOOL KuaiLe", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  }
  svg#stage {
    width: min(98vw, 180vh); max-height: 98vh; height: auto; display: block; border-radius: 18px;
    box-shadow: 0 22px 64px rgba(0, 0, 0, .65); background: var(--palace); touch-action: manipulation;
  }
  svg#stage text { font-family: "ZCOOL KuaiLe", "PingFang SC", sans-serif; }

  @keyframes snowDrift { 0% { transform: translateY(-20px) translateX(0); opacity: 0; } 12% { opacity: .8; } 85% { opacity: .75; } 100% { transform: translateY(540px) translateX(28px); opacity: 0; } }
  .snow { animation: snowFall 9s linear infinite; }
  @keyframes snowFall { 0% { transform: translateY(-24px) translateX(0); opacity: 0; } 12% { opacity: .85; } 88% { opacity: .78; } 100% { transform: translateY(550px) translateX(26px); opacity: 0; } }
  @keyframes flicker { 0%, 100% { opacity: .55; } 50% { opacity: .95; } }
  .flicker { animation: flicker 3.8s ease-in-out infinite; }
  @keyframes bobSlow { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  .bobSlow { animation: bobSlow 3s ease-in-out infinite; }
  @keyframes rippleRing { 0% { transform: scale(.85); opacity: .82; } 100% { transform: scale(1.85); opacity: 0; } }
  .ux-ripple { animation: rippleRing 1.25s ease-out infinite; transform-box: fill-box; transform-origin: center; }

  .ux-btn, .card-btn { cursor: pointer; }
  .ux-btn .btn-vis, .card-btn .card-vis { transition: transform .16s ease, filter .16s ease; }
  .ux-btn:hover .btn-vis, .ux-btn:focus-visible .btn-vis { transform: scale(1.06); filter: drop-shadow(0 0 12px rgba(255, 224, 150, .88)); }
  .card-btn:hover .card-vis, .card-btn:focus-visible .card-vis { transform: scale(1.05); filter: drop-shadow(0 0 14px rgba(164, 226, 255, .92)); }
  .ux-btn:active .btn-vis, .card-btn:active .card-vis { transform: scale(.94); }
  .ux-btn:focus, .ux-btn:focus-visible, .card-btn:focus, .card-btn:focus-visible { outline: none; }
  .ux-btn.is-hold .btn-vis { filter: drop-shadow(0 0 14px rgba(154, 240, 255, .9)); }
  .ux-btn[data-state="lock"], .card-btn[data-state="lock"] { cursor: default; }
  .ux-btn[data-state="lock"]:hover .btn-vis, .card-btn[data-state="lock"]:hover .card-vis { transform: none; filter: none; }

  @keyframes uxShake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-7px); } 75% { transform: translateX(7px); } }
  .ux-shake { animation: uxShake .32s ease-out; }
  @keyframes uxPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
  .ux-pulse > .btn-vis, .ux-pulse > .card-vis, .ux-anim-pulse { animation: uxPulse 1.25s ease-in-out infinite; }
  @keyframes uxPop { 0% { opacity: 0; transform: scale(.45); } 65% { transform: scale(1.08); } 100% { opacity: 1; transform: scale(1); } }
  .ux-pop { opacity: 0; transform: scale(.45); }
  .ux-pop.on { opacity: 1; transform: scale(1); animation: uxPop .42s cubic-bezier(.2, .9, .3, 1.3) both; }
  .ux-slot-magnet .card-vis { transform: scale(1.07); filter: drop-shadow(0 0 18px rgba(255, 210, 122, .95)); }
  .ux-dragging { opacity: .28; }
  @keyframes pageIn { from { opacity: 0; } to { opacity: 1; } }
  .page { animation: pageIn .32s ease; }

  #padFocus rect { fill: none; stroke: #ffd27a; stroke-width: 5; opacity: .95; }
  #modal { pointer-events: auto; }

  #turn {
    display: none; position: fixed; inset: 0; z-index: 20; background: var(--night);
    align-items: center; justify-content: center;
  }
  #turn svg { width: min(55vw, 55vh); height: auto; }
  @keyframes turnHint { 0%, 25% { transform: rotate(0deg); } 65%, 100% { transform: rotate(-90deg); } }
  #turn .tablet { transform-origin: 120px 120px; animation: turnHint 2.6s ease-in-out infinite; }
  @media (orientation: portrait) {
    #turn { display: flex; }
    svg#stage { visibility: hidden; }
  }
</style>

/* Pure state machine for 冰雪故事小导演 (<script id="logic">). Zero DOM access; runs in Node tests and browser. */
const IDLE_HINT_SEC = 14;

function createGame() {
  const g = {
    state: 'title',     // 'title' | 'play' | 'clear' | 'win'
    index: 0,
    phase: 'build',     // 'build' | 'studio'
    time: 0,
    idleTime: 0,
    hintCard: '',
    assistCard: '',
    misses: 0,
    slots: [],          // chosen card IDs in current structure / active puzzle
    stepIdx: 0,         // build cursor
    puzzleIdx: 0,       // for multi-puzzle reason rooms
    demoHeard: false,
    recorded: false,
    studioPlayed: false,
    heroes: {
      elsa: { state: 'idle', cheer: 0 },
      anna: { state: 'idle', cheer: 0 },
      olaf: { state: 'idle', cheer: 0 },
    },
    events: [],

    level() {
      return LEVELS[g.index];
    },

    emit(ev) {
      g.events.push(ev);
    },

    drain() {
      return g.events.splice(0, g.events.length);
    },

    load(i) {
      const idx = Math.max(0, Math.min(LEVELS.length - 1, i | 0));
      const lv = LEVELS[idx];
      g.index = idx;
      g.phase = 'build';
      g.time = 0;
      g.idleTime = 0;
      g.hintCard = '';
      g.assistCard = '';
      g.misses = 0;
      g.stepIdx = 0;
      g.puzzleIdx = 0;
      g.demoHeard = false;
      g.recorded = false;
      g.studioPlayed = false;
      const nSlots = lv.skill === 'episode' ? 5 : ((lv.skill === 'sentence' || lv.skill === 'twist') ? 4 : (lv.skill === 'reason' ? 2 : 3));
      g.slots = new Array(nSlots).fill('');
      for (const k of ['elsa', 'anna', 'olaf']) {
        g.heroes[k] = { state: k === lv.host ? 'speak' : 'idle', cheer: 0 };
      }
      g.events = [];
      g.emit({ type: 'load', index: idx, id: lv.id, skill: lv.skill });
    },

    start(i) {
      g.load(i);
      g.state = 'play';
    },

    currentPuzzle() {
      const lv = g.level();
      if (!lv || lv.skill !== 'reason' || !Array.isArray(lv.puzzles)) return null;
      return lv.puzzles[g.puzzleIdx] || null;
    },

    currentChoices() {
      const lv = g.level();
      if (!lv) return [];
      if (lv.skill === 'sequence' || lv.skill === 'classify' || lv.skill === 'twist') return lv.choices.slice();
      if (lv.skill === 'sentence' || lv.skill === 'episode') return (lv.steps[g.stepIdx] || []).slice();
      const puz = g.currentPuzzle();
      if (lv.skill === 'reason' && puz) return g.stepIdx === 0 ? puz.pickChoices.slice() : puz.whyChoices.slice();
      return [];
    },

    expectedCardId() {
      const lv = g.level();
      if (!lv || g.phase !== 'build') return '';
      if (lv.skill === 'sequence' || lv.skill === 'sentence' || lv.skill === 'twist' || lv.skill === 'episode') return lv.target[g.stepIdx] || '';
      if (lv.skill === 'classify') {
        return lv.target.find(id => !g.slots.includes(id)) || '';
      }
      const puz = g.currentPuzzle();
      if (lv.skill === 'reason' && puz) return puz.answer[g.stepIdx] || '';
      return '';
    },

    studioCards() {
      const lv = g.level();
      if (!lv) return [];
      if (lv.skill === 'reason' && Array.isArray(lv.puzzles)) {
        return lv.puzzles.flatMap(p => (Array.isArray(p.answer) ? p.answer : []));
      }
      return g.slots.filter(Boolean);
    },

    isCustomSentence() {
      const lv = g.level();
      if (!lv || lv.skill !== 'sentence' || !lv.openCompose) return false;
      return g.slots.some((c, i) => c && c !== lv.target[i]);
    },

    resetIdle() {
      g.idleTime = 0;
      g.hintCard = '';
    },

    pickCard(cardId) {
      if (g.state !== 'play' || g.phase !== 'build') return false;
      const lv = g.level();
      const choices = g.currentChoices();
      if (!choices.includes(cardId)) return false;
      g.resetIdle();

      const valid = (lv.skill === 'sentence' && lv.openCompose)
        ? true
        : (lv.skill === 'classify'
          ? lv.target.includes(cardId) && !g.slots.includes(cardId)
          : cardId === g.expectedCardId());

      if (!valid) {
        g.misses++;
        const help = g.expectedCardId();
        g.assistCard = help;
        g.emit({ type: 'card_try', cardId, expected: help, misses: g.misses });
        return false;
      }

      g.slots[g.stepIdx] = cardId;
      g.stepIdx++;
      g.misses = 0;
      g.assistCard = '';
      for (const k of ['elsa', 'anna', 'olaf']) g.heroes[k].cheer = k === lv.host ? 1.0 : 0.6;
      g.emit({ type: 'slot_ok', cardId, slot: g.stepIdx - 1 });

      if (g.stepIdx >= g.slots.length) {
        if (lv.skill === 'reason' && Array.isArray(lv.puzzles) && g.puzzleIdx + 1 < lv.puzzles.length) {
          g.puzzleIdx++;
          g.stepIdx = 0;
          g.slots = ['', ''];
          g.emit({ type: 'puzzle_next', puzzleIdx: g.puzzleIdx });
          return true;
        }
        g.phase = 'studio';
        g.heroes[lv.host].cheer = 1.4;
        g.emit({ type: 'studio_ready', skill: lv.skill, cards: g.studioCards() });
      }
      return true;
    },

    markDemoHeard() {
      if (g.state !== 'play') return;
      g.demoHeard = true;
      g.resetIdle();
      g.emit({ type: 'demo_heard' });
    },

    markRecorded() {
      if (g.state !== 'play') return;
      g.recorded = true;
      g.studioPlayed = true;
      g.resetIdle();
      for (const k of ['elsa', 'anna', 'olaf']) g.heroes[k].cheer = 1.4;
      g.emit({ type: 'recorded', index: g.index });
    },

    cheerHero(who) {
      if (!g.heroes[who]) return false;
      g.heroes[who].cheer = 1.1;
      g.emit({ type: 'cheer', who });
      return true;
    },

    completeRoom() {
      if (g.state !== 'play' || g.phase !== 'studio') return false;
      const last = g.index >= LEVELS.length - 1;
      g.state = last ? 'win' : 'clear';
      g.emit({ type: g.state, index: g.index, id: g.level().id, skill: g.level().skill });
      return true;
    },

    step(dt) {
      if (g.state !== 'play') return;
      const clamped = Math.min(0.05, Math.max(0, dt || 0));
      g.time += clamped;
      g.idleTime += clamped;
      for (const k of ['elsa', 'anna', 'olaf']) {
        const h = g.heroes[k];
        if (h.cheer > 0) h.cheer = Math.max(0, h.cheer - clamped);
      }
      if (!g.hintCard && g.phase === 'build' && g.idleTime >= IDLE_HINT_SEC) {
        g.hintCard = g.expectedCardId();
        if (g.hintCard) g.emit({ type: 'hint_auto', cardId: g.hintCard });
      }
    },
  };
  return g;
}

    box.querySelectorAll('[data-studio-card]').forEach(n => {
      const on = Number(n.getAttribute('data-studio-card')) === idx;

      if (r) r.setAttribute('stroke', on ? '#ffd27a' : '#7dd4ff');

    const box = $('studio');

    const wg = $('studioWaves');

    const rects = wg.querySelectorAll('rect');
    rects.forEach((r, i) => {
      const v = bars ? Math.max(.14, Math.min(1, bars[i] || .14)) : .14;
      const h = Math.round(8 + v * 34);
      r.setAttribute('y', String(22 - Math.round(h / 2)));
      r.setAttribute('height', String(h));

      html += `<circle class="ux-ripple" cx="480" cy="398" r="54" fill="none" stroke="#ff7ca0" stroke-width="4" pointer-events="none"/>`
        + `<circle class="ux-ripple" cx="480" cy="398" r="54" fill="none" stroke="#ffb3c8" stroke-width="3" style="animation-delay:.6s" pointer-events="none"/>`

  function renderStage(g, force) {
    const lv = g.level();
    if (!lv) return;
    const needStatic = force || stageState.idx !== g.index;
    const needRedraw = needStatic || stageState.phase !== g.phase || stageState.stepIdx !== g.stepIdx
      || stageState.puzzleIdx !== g.puzzleIdx || stageState.assistCard !== g.assistCard
      || stageState.hintCard !== g.hintCard || stageState.demoHeard !== g.demoHeard
      || stageState.recorded !== g.recorded;
    if (needStatic) drawStageStatic(lv);
    if (needRedraw) {
      if (g.phase === 'build') drawBuildScene(g);
      else drawStudioScene(g);
      stageState.idx = g.index; stageState.phase = g.phase; stageState.stepIdx = g.stepIdx;
      stageState.puzzleIdx = g.puzzleIdx; stageState.assistCard = g.assistCard;
      stageState.hintCard = g.hintCard; stageState.demoHeard = g.demoHeard; stageState.recorded = g.recorded;
      if (typeof syncHud === 'function') syncHud();
    }
  }
  /* Host & Companion Wing Hero Rendering (Elsa, Anna & Olaf), Live Voice Puppet Bounce & Cheer Tap. */
  const heroDrawn = { built: false, leftWho: '', leftPose: '', rightWho: '', rightPose: '' };
  const liveVoice = { active: false, energy: 0 };

  function setLiveVoice(active, energy) {
    liveVoice.active = !!active;
    liveVoice.energy = Math.max(0, Math.min(1, energy || 0));
  }

  function buildActors() {
    const box = $('actors');
    const sh = $('shadows');
    box.textContent = '';
    sh.textContent = '';
    el('ellipse', { id: 'shLeft', cx: 92, cy: 468, rx: 46, ry: 11, fill: '#0b1024', opacity: '.35' }, sh);
    el('ellipse', { id: 'shRight', cx: 868, cy: 468, rx: 42, ry: 10, fill: '#0b1024', opacity: '.35' }, sh);

    const leftG = el('g', { id: 'heroLeft', class: 'ux-btn', role: 'button', tabindex: '0', 'aria-label': '左侧主角', transform: 'translate(92 466)' }, box);
    const rightG = el('g', { id: 'heroRight', class: 'ux-btn', role: 'button', tabindex: '0', 'aria-label': '右侧伙伴', transform: 'translate(868 466) scale(-1 1)' }, box);
    leftG.addEventListener('click', () => onHeroTap(heroDrawn.leftWho));
    rightG.addEventListener('click', () => onHeroTap(heroDrawn.rightWho));
    heroDrawn.built = true;
    heroDrawn.leftWho = ''; heroDrawn.leftPose = '';
    heroDrawn.rightWho = ''; heroDrawn.rightPose = '';
  }

  function renderHeroSprite(node, who, pose) {
    node.textContent = '';
    const key = `${who}_${pose}`;
    const [pw, ph] = SIZES[key] || SIZES[`${who}_idle`] || [140, 210];
    const targetH = who === 'olaf' ? 168 : 206;
    const scale = targetH / ph;
    const dw = pw * scale, dh = ph * scale;
    const vis = el('g', { class: 'btn-vis' }, node);
    img(key, -dw / 2, -dh, dw, dh, vis);
  }

  function pairForHost(host) {
    if (host === 'olaf') return ['olaf', 'anna'];
    if (host === 'anna') return ['anna', 'olaf'];
    return ['elsa', 'olaf'];
  }

  function renderHeroes(g, now) {
    if (g.state !== 'play') {
      if (heroDrawn.built) { $('actors').textContent = ''; $('shadows').textContent = ''; heroDrawn.built = false; }
      return;
    }
    if (!heroDrawn.built) buildActors();
    const lv = g.level();
    const [leftWho, rightWho] = pairForHost(lv.host);
    const e = liveVoice.active ? liveVoice.energy : 0;
    const poseOf = (who, isLeft) => {
      const h = g.heroes[who];
      if (!h) return 'idle';
      if (h.cheer > 0.05) return 'cheer';
      if (g.phase === 'studio' && liveVoice.active) {
        if (e > .42) return 'cheer';
        if (e > .11 && isLeft) return 'speak';
        if (e > .24 && !isLeft) return 'speak';
        return 'idle';
      }
      return g.phase === 'build' && who === lv.host ? 'speak' : 'idle';
    };
    const lPose = poseOf(leftWho, true), rPose = poseOf(rightWho, false);
    const leftG = $('heroLeft'), rightG = $('heroRight');

    if (heroDrawn.leftWho !== leftWho || heroDrawn.leftPose !== lPose) {
      renderHeroSprite(leftG, leftWho, lPose);

  function uxSlotBadgeSvg(kind, active, radius) {
    const r = radius || 17;
    const stroke = active ? '#fffdf5' : '#fff9ec';
    const sw = active ? 2.8 : 2.2;
    const ring = active ? `<circle r="${r + 3.5}" fill="none" stroke="#ffd27a" stroke-width="2" opacity=".9"/>` : '';
    if (kind === '1' || kind === '2' || kind === '3') {
      const fill = active ? '#ffbe3d' : '#263876';
      const txtCol = active ? '#3c2105' : '#fff9ec';
      return `${ring}<circle r="${r}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/><text x="0" y="6" text-anchor="middle" font-size="18" font-weight="bold" fill="${txtCol}">${kind}</text>`;
    }
    if (kind === 'star1' || kind === 'star2' || kind === 'star3') {
      const n = kind.slice(4);
      const fill = active ? '#ffbe3d' : '#263876';
      const txtCol = active ? '#3c2105' : '#fff9ec';
      return `${ring}<circle r="${r}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/><path d="${UX_STAR_D}" transform="translate(-5 0) scale(7.5)" fill="${active ? '#3c2105' : '#ffd27a'}"/><text x="7" y="5" text-anchor="middle" font-size="15" font-weight="bold" fill="${txtCol}">${n}</text>`;
    }
    if (kind === 'who') {
      return `${ring}<circle r="${r}" fill="#ff7eb6" stroke="${stroke}" stroke-width="${sw}"/><circle cx="0" cy="-4" r="5" fill="#fff9ec"/><path d="M-9 9C-9 3 9 3 9 9Z" fill="#fff9ec"/>`;
    }
    if (kind === 'where') {
      return `${ring}<circle r="${r}" fill="#4db8ff" stroke="${stroke}" stroke-width="${sw}"/><path d="M-8 8V-1L0 -9L8 -1V8H3V3H-3V8Z" fill="#fff9ec"/>`;
    }
    if (kind === 'what') {
      return `${ring}<circle r="${r}" fill="#ffaa33" stroke="${stroke}" stroke-width="${sw}"/><path d="M0 -9L2.5 -2.5L9 0L2.5 2.5L0 9L-2.5 2.5L-9 0L-2.5 -2.5Z" fill="#fff9ec"/>`;
    }
    if (kind === 'mood' || kind === 'heart') {
      return `${ring}<circle r="${r}" fill="#a484ff" stroke="${stroke}" stroke-width="${sw}"/><circle cx="-4" cy="-3" r="1.8" fill="#fff9ec"/><circle cx="4" cy="-3" r="1.8" fill="#fff9ec"/><path d="M-5 3Q0 8 5 3" fill="none" stroke="#fff9ec" stroke-width="2.2" stroke-linecap="round"/>`;
    }
    if (kind === 'pick' || kind === 'end') {
      return `${ring}<circle r="${r}" fill="${kind === 'end' ? '#49c598' : '#ff7eb6'}" stroke="${stroke}" stroke-width="${sw}"/><path d="M-7 1L-2 6L8 -5" fill="none" stroke="#fff9ec" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`;
    }
    if (kind === 'why' || kind === 'so') {
      return `${ring}<circle r="${r}" fill="#ffbe3d" stroke="${stroke}" stroke-width="${sw}"/><circle cx="0" cy="-2" r="6" fill="#fff9ec"/><rect x="-3" y="4" width="6" height="4" rx="1.5" fill="#fff9ec"/>`;
    }
    if (kind === 'plan') {
      return `${ring}<circle r="${r}" fill="#4db8ff" stroke="${stroke}" stroke-width="${sw}"/><path d="M-4 -7V8M-4 -6H6L3 -2L6 2H-4" fill="none" stroke="#fff9ec" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>`;
    }
    if (kind === 'but' || kind === 'oops') {
      return `${ring}<circle r="${r}" fill="#ff738f" stroke="${stroke}" stroke-width="${sw}"/><path d="M-2 -8L4 -1H-1L3 8" fill="none" stroke="#fff9ec" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>`;
    }
    if (kind === 'wand') {
      return `${ring}<circle r="${r}" fill="#45b7e8" stroke="${stroke}" stroke-width="${sw}"/><path d="M-6 6L4 -4M3 -8V-1M0 -5H7" fill="none" stroke="#fff9ec" stroke-width="2.5" stroke-linecap="round"/>`;
    }
    if (kind === 'star_end') {
      return `${ring}<circle r="${r}" fill="#ffbe3d" stroke="${stroke}" stroke-width="${sw}"/><path d="${UX_STAR_D}" transform="scale(10)" fill="#fffdf5"/>`;
    }
    return `${ring}<circle r="${r}" fill="#263876" stroke="${stroke}" stroke-width="${sw}"/>`;
  }

  function uxSlotBadgesFor(lv, count) {
    if (!lv) return [];
    if (lv.skill === 'sequence') return ['1', '2', '3'];
    if (lv.skill === 'sentence') return ['who', 'where', 'what', 'mood'];
    if (lv.skill === 'classify') return ['star1', 'star2', 'star3'];
    if (lv.skill === 'reason') return count === 4 ? ['pick', 'why', 'pick', 'why'] : ['pick', 'why'];
    if (lv.skill === 'twist') return ['plan', 'but', 'so', 'end'];
    if (lv.skill === 'episode') return ['who', 'oops', 'heart', 'wand', 'star_end'];
    return [];
  }

  function uxButton(o) {
    const r = Math.max(32, o.r || 36);
    const hitR = layoutHitRadius(r, !!o.ring);
    const fill = o.plate === 'gold' ? 'url(#goldGrad)' : (o.plate === 'rec' ? 'url(#micRecGrad)' : 'url(#plateGrad)');
    const stroke = o.plate === 'gold' ? '#fff7dc' : (o.plate === 'rec' ? '#ffdbe6' : '#7ea9e8');
    const icCol = o.plate === 'gold' ? '#4a2605' : (o.plate === 'rec' ? '#ffffff' : '#1b2c5c');
    const cls = 'ux-btn' + (o.cls ? ' ' + o.cls : '');
    const pic = o.pic ? uxPic(o.pic, -r * .72, -r * .72, r * 1.44, r * 1.44, '', o.picFit || 'meet') : uxIcon(o.icon || o.ui, r * .66, icCol);
    return `<g class="${cls}" data-act="${o.act}" data-ui="${o.ui || o.act}" role="button" tabindex="0" aria-label="${o.ui || o.act}" transform="translate(${o.x} ${o.y})">
      <circle r="${hitR}" fill="transparent"/><g class="btn-vis" filter="url(#softShadow)">
      <circle r="${r}" fill="${fill}" stroke="${stroke}" stroke-width="3.5"/>${pic}</g></g>`;
  }

  function uxNudge(node) {
    if (!node) return;
    node.classList.remove('ux-shake');
    void node.getBoundingClientRect();
    node.classList.add('ux-shake');
  }

  function uxBind(root, handlers) {
    if (!root) return;
    root.querySelectorAll('[data-act]').forEach(btn => {
      const act = btn.getAttribute('data-act'), ui = btn.getAttribute('data-ui');
      btn.addEventListener('pointerenter', () => { if (ui && typeof voice !== 'undefined') voice.ui(ui); });
      btn.addEventListener('focus', () => { if (ui && typeof voice !== 'undefined') voice.ui(ui); });
      btn.addEventListener('click', () => { if (handlers[act]) handlers[act](btn); });
      btn.addEventListener('keydown', /** @param {KeyboardEvent} e */ e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); if (handlers[act]) handlers[act](btn); } });
    });
  }

  function showStory(keys, done) {
    const s = uxScreen('story');
    uxPreload(keys);
    let idx = 0;
    const render = () => {
      if (!uxAlive(s)) return;
      const key = keys[idx];
      const root = uxPaint(`<g class="page">
        ${storyBeatSceneHtml(key)}
        <rect width="960" height="520" fill="url(#bottomFade)" opacity=".55" pointer-events="none"/>
        <g transform="translate(480 488)">${keys.map((_, k) => `<circle cx="${(k - (keys.length - 1) / 2) * 20}" cy="0" r="${k === idx ? 6 : 4.5}" fill="${k === idx ? '#ffd27a' : '#96b4e8'}"/>`).join('')}</g>
        ${uxButton({ act: 'next', ui: 'next', icon: 'next', x: 886, y: 452, r: 38, plate: 'gold' })}
      </g>`);
      const next = () => {
        if (!uxAlive(s)) return;
        uxStopVoice();
        if (++idx < keys.length) render();
        else uxEnd(s, done);
      };
      s.onKey = next;
      uxBind(root, { next });
      uxLine(key).then(() => {
        if (!uxAlive(s)) return;
        const b = root.querySelector('[data-act="next"]');
        if (b) b.classList.add('ux-pulse');

  function showChapter(level, done) {
    const lv = uxLevel(level), s = uxScreen('chapter');
    const host = lv.host || 'elsa';

      : (lv.target || []).slice(0, 5);
    const badges = uxSlotBadgesFor(lv, preview.length);
    const pn = Math.max(1, preview.length);
    const pw = pn >= 5 ? 90 : 104, ph = pn >= 5 ? 90 : 104, pgap = pn >= 5 ? 16 : (pn >= 4 ? 22 : 38);
    const px0 = 480 - (pn * pw + (pn - 1) * pgap) / 2;
    const py = pn >= 5 ? 224 : 214;
    const previewHtml = preview.map((cid, i) => {
      const px = px0 + i * (pw + pgap);
      const bk = lv.skill === 'reason' ? (i === 0 ? '' : badges[i - 1]) : badges[i];
      const conn = i < pn - 1

  function openParentModal() {
    const modal = $('modal');
    if (!modal || uxState.modal) return;
    uxState.modal = true;
    let tab = 'stats';
    let tipIdx = 0;
    let pageIdx = 0;
    let toast = '';
    let exportItems = [];

    const fmtSec = ms => ms ? (ms / 1000).toFixed(1) + '秒' : '—';
    const fmtDate = ts => {
      if (!ts) return '';
      const d = new Date(ts);
      return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    };

    const tierLabel = t => t === 'cloze' ? '接力(推荐)' : (t === 'director' ? '点卡' : '独立');

    const refreshExportItems = async () => {
      const keySet = new Set(await recorder.listClipKeys());
      const items = [];
      for (const lv of LEVELS) {
        const lk = 'room_' + lv.id;
        const fk = lk + '_first';
        if (keySet.has(lk)) {
          const rSave = (save.rooms && save.rooms[lv.id]) || {};
          items.push({
            kind: 'room', key: lk, firstKey: keySet.has(fk) ? fk : '',
            title: `${lv.badge}. ${lv.title}`,
            sub: `首次 ${fmtSec(rSave.firstSpeechMs)} · 最新 ${fmtSec(rSave.lastSpeechMs)}`,
          });
        }
      }
      for (const c of save.creations || []) {
        if (!keySet.has(c.id)) continue;
        items.push({
          kind: 'free', key: c.id, firstKey: '',
          title: c.mode === 'mountain' ? '自由故事山作品' : '自由造句列车作品',
          sub: `${fmtDate(c.createdAt)} · 开口 ${fmtSec(c.activeSpeechMs || c.durationMs)}`,
        });
      }
      for (const d of save.diary || []) {
        if (!keySet.has(d.id)) continue;
        const tp = (INTERVIEW_TOPICS || []).find(t => t.id === d.topicId);
        items.push({
          kind: 'diary', key: d.id, firstKey: '',
          title: `雪宝日记：${tp ? tp.title : d.topicId}`,
          sub: `${fmtDate(d.createdAt)} · 开口 ${fmtSec(d.activeSpeechMs || d.durationMs)}`,
        });
      }
      exportItems = items;
    };

    const stopModalAudio = () => {
      recorder.stopPlay();
      setRecordingAudioMode('off');
    };

    const drawModal = () => {
      const mins = Math.max(1, Math.round((save.totalPlaySeconds || 0) / 60));
      const avgSec = save.speechSamples > 0 ? ((save.totalSpeechMs / save.speechSamples) / 1000).toFixed(1) : '0.0';
      const worksCount = (save.creations || []).length + (save.diary || []).length;

      const tabsHtml = `<g transform="translate(150 56)">
        <g class="ux-btn" data-m="tab_stats"><rect width="170" height="34" rx="17" fill="${tab === 'stats' ? 'url(#goldGrad)' : '#eef5ff'}" stroke="#d6a44e" stroke-width="2"/><text x="85" y="23" text-anchor="middle" font-size="15" fill="#1e2a58">表达力报告与设置</text></g>
        <g class="ux-btn" data-m="tab_export" transform="translate(190 0)"><rect width="170" height="34" rx="17" fill="${tab === 'export' ? 'url(#goldGrad)' : '#eef5ff'}" stroke="#d6a44e" stroke-width="2"/><text x="85" y="23" text-anchor="middle" font-size="15" fill="#1e2a58">首次/最新对比与导出</text></g>
      </g>`;

      let bodyHtml;
      if (tab === 'stats') {
        const skList = [
          ['sequence', '1. 时间顺序 (先·接着·最后)', '#ff9cc4'],
          ['sentence', '2. 完整句子 (谁·在哪·干什么)', '#7dd4ff'],
          ['classify', '3. 总分归类 (总括+一二三)', '#ffd27a'],
          ['reason', '4. 因果理由 (我选…因为…)', '#b79cff'],
          ['twist', '5. 转折解困 (本来想·可是·于是)', '#49c598'],
          ['episode', '6. 完整故事山 (五要素+心里感受)', '#ff8c66'],
        ];
        const bars = skList.map(([k, lbl, col], idx) => {
          const val = Math.min(2, (save.skills && save.skills[k]) || 0);
          const y = 148 + idx * 27;
          return `<text x="36" y="${y}" font-size="14" fill="#233262">${lbl}</text>
            <rect x="292" y="${y - 13}" width="276" height="14" rx="7" fill="#e1ecff"/>
            <rect x="292" y="${y - 13}" width="${Math.round((val / 2) * 276)}" height="14" rx="7" fill="${col}"/>
            <text x="582" y="${y}" font-size="14" fill="#4e5d8c">${val}/2</text>`;
        }).join('');
        const tipLines = wrap(LEVELS[tipIdx].parentTip || '', 32).slice(0, 2);
        const curTier = save.studioTier || 'cloze';
        bodyHtml = `<text x="330" y="116" text-anchor="middle" font-size="14" fill="#4e5d8c">录音：${save.recordingsCount || 0}次 · 平均开口：${avgSec}秒 · 创作/日记：${worksCount}篇 · 探索：${mins}分</text>
          ${bars}
          <g class="ux-btn" data-m="nextTip" transform="translate(36 312)">
            <rect width="588" height="72" rx="14" fill="#eef5ff" stroke="#7dd4ff" stroke-width="2"/>
            <text x="14" y="22" font-size="13" fill="#b8326a">亲子日常提问建议（点我换一条 · 第${tipIdx + 1}/${LEVELS.length}幕）：</text>
            ${tipLines.map((ln, i) => `<text x="14" y="${44 + i * 20}" font-size="14" fill="#1e2a58">${ln}</text>`).join('')}
          </g>
          <g class="ux-btn" data-m="subs" transform="translate(36 400)"><rect width="94" height="44" rx="12" fill="#eef5ff" stroke="#7ea9e8" stroke-width="2"/><text x="47" y="28" text-anchor="middle" font-size="14" fill="#1e2a58">字幕：${setting('subtitles') ? '开' : '关'}</text></g>
          <g class="ux-btn" data-m="snd" transform="translate(138 400)"><rect width="94" height="44" rx="12" fill="#eef5ff" stroke="#7ea9e8" stroke-width="2"/><text x="47" y="28" text-anchor="middle" font-size="14" fill="#1e2a58">声音：${setting('sound') ? '开' : '关'}</text></g>
          <g class="ux-btn" data-m="eye" transform="translate(240 400)"><rect width="118" height="44" rx="12" fill="#eef5ff" stroke="#7ea9e8" stroke-width="2"/><text x="59" y="28" text-anchor="middle" font-size="14" fill="#1e2a58">护眼：${setting('eyeCare') ? '10分' : '关'}</text></g>
          <g class="ux-btn" data-m="tier" transform="translate(366 400)"><rect width="146" height="44" rx="12" fill="#eef5ff" stroke="#7ea9e8" stroke-width="2"/><text x="73" y="28" text-anchor="middle" font-size="14" fill="#1e2a58">支架：${tierLabel(curTier)}</text></g>
          <g class="ux-btn" data-m="close" transform="translate(520 400)"><rect width="104" height="44" rx="12" fill="url(#goldGrad)" stroke="#d6a44e" stroke-width="2"/><text x="52" y="28" text-anchor="middle" font-size="16" fill="#4a2605">关闭返回</text></g>`;

        const slice = exportItems.slice(pageIdx * perPage, (pageIdx + 1) * perPage);
        const rowsHtml = slice.length
          ? slice.map((it, idx) => {
            const ry = 108 + idx * 54;
            const firstBtn = it.firstKey ? `<g class="ux-btn" data-m="play_${it.firstKey}" transform="translate(310 8)"><rect width="74" height="32" rx="10" fill="#fff0c4" stroke="#e2a832" stroke-width="1.5"/><text x="37" y="21" text-anchor="middle" font-size="13" fill="#4a2605">▶ 首次</text></g>` : '';
            const latestLabel = it.kind === 'room' ? '▶ 最新' : '▶ 播放';
            const delBtn = it.kind !== 'room' ? `<g class="ux-btn" data-m="del_${it.kind}_${it.key}" transform="translate(546 8)"><rect width="42" height="32" rx="10" fill="#ffe4ec" stroke="#e26a8b" stroke-width="1.5"/><text x="21" y="21" text-anchor="middle" font-size="13" fill="#8b1e3f">删</text></g>` : '';
            return `<g transform="translate(36 ${ry})">
              <rect width="588" height="48" rx="12" fill="#eef5ff" stroke="#bfd6f6" stroke-width="1.5"/>
              <text x="14" y="21" font-size="14" fill="#1e2a58">${it.title}</text>
              <text x="14" y="39" font-size="12" fill="#526594">${it.sub}</text>
              ${firstBtn}
              <g class="ux-btn" data-m="play_${it.key}" transform="translate(392 8)"><rect width="74" height="32" rx="10" fill="#dbeeff" stroke="#6aaee6" stroke-width="1.5"/><text x="37" y="21" text-anchor="middle" font-size="13" fill="#123a66">${latestLabel}</text></g>
              <g class="ux-btn" data-m="exp_${it.key}" transform="translate(474 8)"><rect width="66" height="32" rx="10" fill="#e2f7ec" stroke="#49b683" stroke-width="1.5"/><text x="33" y="21" text-anchor="middle" font-size="13" fill="#0f5937">导出</text></g>
              ${delBtn}
            </g>`;
          }).join('')
          : `<text x="330" y="240" text-anchor="middle" font-size="16" fill="#5a6d9c">还没有本地录音哦，先去录一段故事吧！</text>`;

        bodyHtml = `${rowsHtml}
          <text x="330" y="390" text-anchor="middle" font-size="13" fill="#b8326a">${toast}</text>
          <g class="ux-btn" data-m="prevPage" transform="translate(36 400)"><rect width="120" height="44" rx="12" fill="#eef5ff" stroke="#7ea9e8" stroke-width="2"/><text x="60" y="28" text-anchor="middle" font-size="15" fill="#1e2a58">上一页</text></g>
          <text x="242" y="427" text-anchor="middle" font-size="14" fill="#4e5d8c">第 ${pageIdx + 1}/${maxPage + 1} 页</text>
          <g class="ux-btn" data-m="nextPage" transform="translate(324 400)"><rect width="120" height="44" rx="12" fill="#eef5ff" stroke="#7ea9e8" stroke-width="2"/><text x="60" y="28" text-anchor="middle" font-size="15" fill="#1e2a58">下一页</text></g>
          <g class="ux-btn" data-m="close" transform="translate(492 400)"><rect width="132" height="44" rx="12" fill="url(#goldGrad)" stroke="#d6a44e" stroke-width="2"/><text x="66" y="28" text-anchor="middle" font-size="17" fill="#4a2605">关闭返回</text></g>`;
      }

          ${tabsHtml}
          ${bodyHtml}
        </g>`;

      modal.querySelectorAll('[data-m]').forEach(b => {
        b.addEventListener('click', async () => {
          const m = b.getAttribute('data-m') || '';
          if (m === 'subs') { setSetting('subtitles', !setting('subtitles')); drawModal(); }
          else if (m === 'snd') { setSetting('sound', !setting('sound')); drawModal(); }
          else if (m === 'eye') { setSetting('eyeCare', !setting('eyeCare')); drawModal(); }
          else if (m === 'tier') {
            const order = ['cloze', 'director', 'anchor'];
            const next = order[(order.indexOf(save.studioTier || 'cloze') + 1) % order.length];
            save.studioTier = next;
            if (typeof stageState === 'object') stageState.tier = next;
            saveWrite();
            drawModal();
          }
          else if (m === 'nextTip') { tipIdx = (tipIdx + 1) % LEVELS.length; drawModal(); }
          else if (m === 'tab_stats') { stopModalAudio(); tab = 'stats'; drawModal(); }
          else if (m === 'tab_export') { stopModalAudio(); tab = 'export'; await refreshExportItems(); drawModal(); }
          else if (m === 'prevPage') { pageIdx = Math.max(0, pageIdx - 1); drawModal(); }
          else if (m === 'nextPage') { pageIdx++; drawModal(); }
          else if (m.startsWith('play_')) {
            const k = m.slice(5);
            const blob = await recorder.loadClip(k);
            if (blob) { setRecordingAudioMode('rec_quiet'); recorder.play(blob, () => setRecordingAudioMode('off')); }
          } else if (m.startsWith('exp_')) {
            const k = m.slice(4);
            const blob = await recorder.loadClip(k);
            if (blob) {
              await recorder.exportWav(blob, `story_${k}.wav`);
              toast = '已导出为本地 WAV 音频！';
              drawModal();
            }
          } else if (m.startsWith('del_')) {
            const rest = m.slice(4);
            const sep = rest.indexOf('_');
            const kind = rest.slice(0, sep), k = rest.slice(sep + 1);
            await recorder.deleteClip(k);
            if (kind === 'free') save.creations = (save.creations || []).filter(c => c.id !== k);
            else if (kind === 'diary') save.diary = (save.diary || []).filter(d => d.id !== k);
            saveWrite();
            await refreshExportItems();
            toast = '已删除该条作品。';
            drawModal();
          } else {
            stopModalAudio();
            uxState.modal = false;
            modal.textContent = '';
          }
        });
      });
    };
    drawModal();
  }

  function showWorkshop() {

      { act: 'free', ui: 'train', card: 'card_act_castle', badge: '', ic: 'train', x: 376 },

      <g class="btn-vis" filter="url(#softShadow)">
        <rect width="208" height="248" rx="30" fill="#fff9ec" stroke="#ffd27a" stroke-width="4.5"/>

    uxBind(root, {

      interview: () => uxEnd(s, () => showInterview()),

  function showInterview() {
    const s = uxScreen('interview');
    const topics = INTERVIEW_TOPICS || [];
    loadArt(topics.map(t => t.card), ART_PATIENCE);

    let activeTopic = null;
    let recBusy = false;
    let playBusy = false;
    let clipBlob = null;

    const updateIntWaves = bars => {
      const wg = $('intWaves');
      if (!wg) return;
      wg.querySelectorAll('rect').forEach((r, i) => {
        const v = bars ? Math.max(.14, Math.min(1, bars[i] || .14)) : .14;
        const h = Math.round(8 + v * 34);
        r.setAttribute('y', String(22 - Math.round(h / 2)));
        r.setAttribute('height', String(h));
      });
    };

    const updateIntOlaf = energy => {
      const olaf = $('intOlaf');
      if (olaf) {
        const e = energy || 0;
        const dy = -Math.round(e * 18);
        olaf.setAttribute('transform', `translate(86 ${430 + dy})`);
        const imgNode = olaf.querySelector('image');
        const want = e > .4 ? 'olaf_cheer' : (e > .1 ? 'olaf_speak' : 'olaf_idle');
        if (imgNode && !imgNode.getAttribute('href').includes(want)) imgNode.setAttribute('href', SRC(want));
      }
      if (energy > .16 && typeof fxVoiceSparkle === 'function') fxVoiceSparkle(energy);
    };

    const cleanup = () => {
      if (recBusy) { recorder.stop(); recBusy = false; }
      playBusy = false;
      recorder.stopPlay();
      setRecordingAudioMode('off');
      saveWrite();
    };

    const render = () => {
      if (!uxAlive(s)) return;
      if (!activeTopic) {
        const gridHtml = topics.map((tp, i) => {
          const col = i % 2, row = (i / 2) | 0;
          const x = 216 + col * 284, y = 104 + row * 188;
          const badgeHtml = tp.badges.map((bk, bi) => `<g transform="translate(${74 + bi * 46} 148)">${uxSlotBadgeSvg(bk, false, 14)}</g>`).join('');
          return `<g class="ux-btn" data-topic="${tp.id}" role="button" tabindex="0" aria-label="${tp.title}" transform="translate(${x} ${y})">
            <g class="btn-vis" filter="url(#softShadow)">
              <rect width="244" height="162" rx="26" fill="#fff9ec" stroke="#ffd27a" stroke-width="4"/>
              <image href="${SRC(tp.card)}" x="52" y="14" width="140" height="114" preserveAspectRatio="xMidYMid meet"/>
              ${badgeHtml}
            </g>
          </g>`;
        }).join('');

        const root = uxPaint(`<g class="page">
          <image href="${SRC('bg_cozy')}" width="960" height="520" preserveAspectRatio="xMidYMid slice"/>
          <rect width="960" height="520" fill="#101836" opacity=".56"/>
          ${uxButton({ act: 'back', ui: 'back', icon: 'back', x: 56, y: 46, r: 32 })}
          <g filter="url(#softShadow)">
            <rect x="410" y="18" width="140" height="52" rx="26" fill="#141c42" opacity=".92" stroke="#ffd27a" stroke-width="2.5"/>
            <image href="${SRC('portrait_olaf')}" x="424" y="24" width="40" height="40" preserveAspectRatio="xMidYMid meet"/>
            ${uxPic('prop_mic', 494, 24, 28, 40, '', 'meet')}
          </g>
          <image href="${SRC('olaf_cheer')}" x="44" y="250" width="140" height="186" preserveAspectRatio="xMidYMid meet"/>
          <image href="${SRC('anna_idle')}" x="790" y="220" width="124" height="214" preserveAspectRatio="xMidYMid meet" transform="scale(-1 1) translate(-1704 0)"/>
          ${gridHtml}
        </g>`);

        const back = () => { cleanup(); uxEnd(s, () => showWorkshop()); };
        s.onKey = back;
        uxBind(root, { back });
        root.querySelectorAll('[data-topic]').forEach(btn => {
          const tid = btn.getAttribute('data-topic');
          const goTopic = () => {
            activeTopic = topics.find(t => t.id === tid) || null;
            clipBlob = null;
            uxSfx('tap');
            render();
            if (activeTopic) uxLine(activeTopic.voiceKey, { interrupt: true, maxWait: 7500 });
          };
          btn.addEventListener('click', goTopic);
          btn.addEventListener('keydown', /** @param {KeyboardEvent} e */ e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); goTopic(); } });
        });
        return;
      }

      const tp = activeTopic;
      const badgeStrip = tp.badges.map((bk, bi) => `<g transform="translate(${480 + (bi - (tp.badges.length - 1) / 2) * 56} 234)">${uxSlotBadgeSvg(bk, recBusy, 16)}</g>`).join('');
      const waveCols = ['#7dd4ff', '#9fe8ff', '#ff9cc4', '#ffd27a', '#ff9cc4', '#9fe8ff', '#7dd4ff'];
      const wavesHtml = waveCols.map((c, i) => `<rect x="${(i - 3) * 26 - 6}" y="17" width="12" height="10" rx="6" fill="${c}" opacity="${recBusy || playBusy ? '.98' : '.42'}"/>`).join('');

      const micRipple = recBusy ? `<circle class="ux-ripple" cx="480" cy="400" r="54" fill="none" stroke="#ff7ca0" stroke-width="4" pointer-events="none"/>` : '';
      const micBtn = micRipple + uxButton(recBusy
        ? { act: 'intMic', ui: 'stop', icon: 'stop', x: 480, y: 400, r: 52, plate: 'rec', cls: 'ux-pulse' }
        : { act: 'intMic', ui: 'mic', pic: 'prop_mic', x: 480, y: 400, r: 52, plate: 'gold', cls: !clipBlob ? 'ux-pulse' : '' });
      const playBtn = clipBlob && !recBusy ? uxButton({ act: 'intPlay', ui: 'listen', icon: 'play', x: 646, y: 406, r: 38, plate: 'gold' }) : '';

      const root = uxPaint(`<g class="page">
        <image href="${SRC('bg_cozy')}" width="960" height="520" preserveAspectRatio="xMidYMid slice"/>
        <rect width="960" height="520" fill="#101836" opacity=".52"/>
        ${uxButton({ act: 'backTopic', ui: 'back', icon: 'back', x: 56, y: 46, r: 32 })}
        <g id="intOlaf" transform="translate(86 430)"><image href="${SRC('olaf_idle')}" x="-64" y="-190" width="128" height="190" preserveAspectRatio="xMidYMax meet"/></g>
        <g filter="url(#softShadow)">
          <rect x="358" y="42" width="244" height="172" rx="28" fill="#fff9ec" stroke="#ffd27a" stroke-width="4.5"/>
          <image href="${SRC(tp.card)}" x="394" y="54" width="172" height="148" preserveAspectRatio="xMidYMid meet"/>
        </g>
        ${badgeStrip}
        <g id="intWaves" transform="translate(480 282)">${wavesHtml}</g>
        ${uxButton({ act: 'askAgain', ui: 'demo', icon: 'speaker', x: 314, y: 406, r: 38 })}
        ${micBtn}
        ${playBtn}
      </g>`);

      const backTopic = () => {
        cleanup();
        activeTopic = null;
        clipBlob = null;
        render();
      };
      s.onKey = backTopic;

      const playCurrent = () => {
        if (!clipBlob || recBusy) return;
        playBusy = true;
        render();
        setRecordingAudioMode('premiere');
        recorder.play(clipBlob, () => {
          playBusy = false;
          setRecordingAudioMode('off');
          updateIntWaves(null);
          updateIntOlaf(0);
          if (uxAlive(s)) render();
        }, { fx: 'normal', onBars: updateIntWaves, onEnergy: updateIntOlaf });
      };

      const stopRecordingNow = async () => {
        if (!recBusy) return;
        const res = await recorder.stop();
        recBusy = false;
        setRecordingAudioMode('off');
        updateIntWaves(null);
        updateIntOlaf(0);
        uxSfx('mic_stop');
        if (res && res.blob) {
          clipBlob = res.blob;
          const did = 'diary_' + Date.now();
          const meta = { createdAt: Date.now(), topicId: tp.id, durationMs: res.durationMs || 0, activeSpeechMs: res.activeSpeechMs || 0 };
          await recorder.saveClip(did, res.blob);
          await recorder.saveMeta(did, meta);
          save.diary = [{ id: did, topicId: tp.id, createdAt: meta.createdAt, durationMs: meta.durationMs, activeSpeechMs: meta.activeSpeechMs }, ...(save.diary || [])];
          while (save.diary.length > 30) {
            const dropped = save.diary.pop();
            if (dropped) recorder.deleteClip(dropped.id);
          }
          save.recordingsCount = (save.recordingsCount || 0) + 1;
          save.speechSamples = (save.speechSamples || 0) + 1;
          save.totalSpeechMs = (save.totalSpeechMs || 0) + (res.activeSpeechMs || 0);
          saveWrite();
          render();
          playCurrent();
          uxConfetti(root.querySelector('.page'), 480, 220, 26);
        } else render();
      };

      uxBind(root, {
        backTopic,
        askAgain: () => { if (!recBusy) uxLine(tp.voiceKey, { interrupt: true, maxWait: 7500 }); },
        intPlay: playCurrent,
        intMic: async () => {
          unlockAudio();
          if (recBusy) { await stopRecordingNow(); return; }
          setRecordingAudioMode('rec_quiet');
          const st = await recorder.start(
            fd => {
              updateIntWaves(fd.bars);
              updateIntOlaf(fd.energy);
              if (fd.vad.activeSpeechMs >= 1500 && fd.vad.silenceAfterSpeechMs >= 2800 && recBusy) stopRecordingNow();
            },
            () => { if (recBusy && uxAlive(s)) stopRecordingNow(); },
          );
          if (!st.ok) {
            setRecordingAudioMode('off');
            uxLine('mic_fallback', { interrupt: true, maxWait: 4500 });
            return;
          }
          recBusy = true;
          uxSfx('mic_start');
          render();
        },
      });
    };

    render();
    uxLine('interview_intro', { maxWait: 6500 });
  }

  function showFreeTrain() {
    const s = uxScreen('freeTrain');
    loadArt([...FREE_TRAIN_POOL.slots.flat(), ...FREE_MOUNTAIN_POOL.slots.flat()], ART_PATIENCE);
    let mode = 'train';
    let picked = FREE_TRAIN_POOL.slots.map(row => row[0]);
    let activeSlotIdx = 0;
    let recBusy = false;
    let clipBlob = null;
    let activeCarIdx = -1;
    let playSeq = 0;

    let render = () => {};
    const poolFor = () => mode === 'mountain' ? FREE_MOUNTAIN_POOL : FREE_TRAIN_POOL;

    const readTrain = async () => {
      if (!uxAlive(s)) return;
      const seq = ++playSeq;
      save.freeSentences = (save.freeSentences || 0) + 1;
      saveSoon();
      for (let i = 0; i < picked.length; i++) {
        if (!uxAlive(s) || recBusy || seq !== playSeq) return;
        activeCarIdx = i;
        render();
        const m = CARD_META[picked[i]];
        if (m && m.voiceKey && hasLineKey(m.voiceKey)) {
          await voice.line(m.voiceKey, { interrupt: true, tag: 'card', maxWait: 2500, subtitle: false });
        }
      }
      if (uxAlive(s) && seq === playSeq) {
        activeCarIdx = -1;
        render();
        uxConfetti(document.querySelector('#overlay .page'), 440, 200, 18);
      }
    };

    render = () => {
      if (!uxAlive(s)) return;
      const isMt = mode === 'mountain';
      const pool = poolFor();
      const kinds = isMt ? ['who', 'oops', 'heart', 'wand', 'star_end'] : ['who', 'where', 'what', 'mood'];
      const n = pool.slots.length;
      const cw = isMt ? 124 : 154;
      const ch = isMt ? 106 : 114;
      const gap = isMt ? 14 : 22;
      const x0 = isMt ? 62 : 76;
      const mtYs = [126, 112, 98, 112, 126];

      const arcHtml = isMt
        ? `<path d="M ${mtYs.map((yy, i) => `${x0 + i * (cw + gap) + cw / 2} ${yy + ch / 2}`).join(' L ')}" fill="none" stroke="#ffd27a" stroke-width="3.5" stroke-dasharray="7 5" opacity=".65"/>`
        : '';

      const carsHtml = picked.map((cid, i) => {
        const x = x0 + i * (cw + gap);
        const y = isMt ? mtYs[i] : 104;
        const meta = CARD_META[cid] || { label: cid };
        const hot = activeCarIdx === i || (activeCarIdx < 0 && activeSlotIdx === i);
        const conn = !isMt && i < 3 ? `<rect x="${cw - 2}" y="54" width="${gap + 4}" height="8" rx="4" fill="#ffd27a"/>` : '';
        const wheels = !isMt ? `<circle cx="36" cy="${ch + 8}" r="11" fill="#263876" stroke="#ffd27a" stroke-width="2.6"/><circle cx="${cw - 36}" cy="${ch + 8}" r="11" fill="#263876" stroke="#ffd27a" stroke-width="2.6"/>` : '';
        return `<g class="card-btn${hot ? ' ux-pulse' : ''}" data-car="${i}" role="button" tabindex="0" aria-label="${meta.label}" transform="translate(${x} ${y})">
          ${conn}${wheels}
          <g class="card-vis" filter="url(#softShadow)">
            <rect width="${cw}" height="${ch}" rx="20" fill="#fff9ec" stroke="${hot ? '#ffd27a' : '#7dd4ff'}" stroke-width="${hot ? 4.5 : 3.2}"/>
            <g transform="translate(${cw / 2} -2)">${uxSlotBadgeSvg(kinds[i], hot, 15)}</g>
            <image href="${SRC(cid)}" x="${(cw - 88) / 2}" y="16" width="88" height="86" preserveAspectRatio="xMidYMid meet"/>
          </g>
        </g>`;
      }).join('');

      // Single clean active-slot choice tray at bottom (3-4 big crisp cards)
      const choices = pool.slots[activeSlotIdx] || [];
      const bw = 148, bh = 146, bgap = 24;
      const bx0 = 418 - (choices.length * bw + (choices.length - 1) * bgap) / 2;
      const choicesHtml = choices.map((cid, rIdx) => {
        const active = picked[activeSlotIdx] === cid;
        const meta = CARD_META[cid] || { label: cid };
        const tx = bx0 + rIdx * (bw + bgap);
        return `<g class="card-btn" data-pick-cid="${cid}" role="button" tabindex="0" aria-label="${meta.label}" transform="translate(${tx} 274)">
          <g class="card-vis" filter="url(#softShadow)">
            <rect width="${bw}" height="${bh}" rx="22" fill="${active ? '#ffe08a' : '#fff9ec'}" stroke="${active ? '#f59e0b' : '#7ea9e8'}" stroke-width="${active ? 4.2 : 2.8}"/>
            <image href="${SRC(cid)}" x="14" y="14" width="${bw - 28}" height="${bh - 28}" preserveAspectRatio="xMidYMid meet"/>
          </g>
        </g>`;
      }).join('');

      const playBtn = uxButton({ act: 'speakTrain', ui: 'demo', icon: 'speaker', x: 890, y: 146, r: 38, plate: 'gold' });
      const micRipple = recBusy ? `<circle class="ux-ripple" cx="890" cy="264" r="48" fill="none" stroke="#ff7ca0" stroke-width="4" pointer-events="none"/>` : '';
      const micBtn = micRipple + uxButton(recBusy
        ? { act: 'freeMic', ui: 'stop', icon: 'stop', x: 890, y: 264, r: 46, plate: 'rec', cls: 'ux-pulse' }
        : { act: 'freeMic', ui: 'mic', pic: 'prop_mic', x: 890, y: 264, r: 46, plate: 'gold' });
      const listenBtn = clipBlob && !recBusy ? uxButton({ act: 'freePlay', ui: 'listen', icon: 'play', x: 890, y: 382, r: 36 }) : '';

      const root = uxPaint(`<g class="page">
        <image href="${SRC('bg_garden')}" width="960" height="520" preserveAspectRatio="xMidYMid slice"/>
        <rect width="960" height="520" fill="#101836" opacity=".54"/>
        ${uxButton({ act: 'back', ui: 'back', icon: 'back', x: 52, y: 42, r: 32 })}
        ${uxButton({ act: 'modeTrain', ui: 'mode_train', icon: 'train', x: 430, y: 42, r: 32, plate: !isMt ? 'gold' : '' })}
        ${uxButton({ act: 'modeMountain', ui: 'mode_mountain', icon: 'mountain', x: 526, y: 42, r: 32, plate: isMt ? 'gold' : '' })}
        ${arcHtml}${carsHtml}${choicesHtml}${playBtn}${micBtn}${listenBtn}
      </g>`);

      const cleanup = () => {
        playSeq++;
        activeCarIdx = -1;
        if (recBusy) { recorder.stop(); recBusy = false; }
        recorder.stopPlay();
        setRecordingAudioMode('off');
        saveWrite();
      };
      const back = () => { cleanup(); uxEnd(s, () => showWorkshop()); };
      s.onKey = back;

      const playBlob = b => {
        setRecordingAudioMode('premiere');
        recorder.play(b, () => setRecordingAudioMode('off'), { fx: 'normal' });
      };

      const finishRec = async () => {
        if (!recBusy) return;
        const res = await recorder.stop();
        recBusy = false;
        setRecordingAudioMode('off');
        uxSfx('mic_stop');
        if (res && res.blob) {
          clipBlob = res.blob;
          const fid = 'free_' + Date.now();
          const meta = { createdAt: Date.now(), mode, cards: picked.slice(), durationMs: res.durationMs || 0, activeSpeechMs: res.activeSpeechMs || 0 };
          await recorder.saveClip(fid, res.blob);
          await recorder.saveMeta(fid, meta);
          save.creations = [{ id: fid, mode, cards: picked.slice(), createdAt: meta.createdAt, durationMs: meta.durationMs, activeSpeechMs: meta.activeSpeechMs, timeline: [] }, ...(save.creations || [])];
          while (save.creations.length > 30) {
            const dropped = save.creations.pop();
            if (dropped) recorder.deleteClip(dropped.id);
          }
          save.recordingsCount = (save.recordingsCount || 0) + 1;
          save.speechSamples = (save.speechSamples || 0) + 1;
          save.totalSpeechMs = (save.totalSpeechMs || 0) + (res.activeSpeechMs || 0);
          saveWrite();
          render();
          playBlob(res.blob);
        } else render();
      };

      uxBind(root, {
        back,
        modeTrain: () => {
          if (recBusy || mode === 'train') return;
          playSeq++; activeCarIdx = -1; mode = 'train'; activeSlotIdx = 0;
          picked = FREE_TRAIN_POOL.slots.map(row => row[0]);
          clipBlob = null; uxSfx('tap'); render();
        },
        modeMountain: () => {
          if (recBusy || mode === 'mountain') return;
          playSeq++; activeCarIdx = -1; mode = 'mountain'; activeSlotIdx = 0;
          picked = FREE_MOUNTAIN_POOL.slots.map(row => row[0]);
          clipBlob = null; uxSfx('tap'); render();
        },
        speakTrain: () => readTrain(),
        freeMic: async () => {
          unlockAudio();
          playSeq++;
          activeCarIdx = -1;
          if (recBusy) { await finishRec(); return; }
          setRecordingAudioMode('rec_quiet');
          const st = await recorder.start(
            fd => { if (fd.vad.activeSpeechMs >= 1500 && fd.vad.silenceAfterSpeechMs >= 2800 && recBusy) finishRec(); },
            () => { if (recBusy && uxAlive(s)) finishRec(); },
          );
          if (!st.ok) {
            setRecordingAudioMode('off');
            uxLine('mic_fallback', { interrupt: true, maxWait: 4500 });
            readTrain();
            return;
          }
          recBusy = true;
          uxSfx('mic_start');
          render();
        },
        freePlay: () => { if (clipBlob) playBlob(clipBlob); },
      });

      root.querySelectorAll('[data-pick-cid]').forEach(btn => {
        const cid = btn.getAttribute('data-pick-cid');
        const pick = () => {
          playSeq++;
          activeCarIdx = -1;
          picked[activeSlotIdx] = cid;
          uxSfx('tap');
          const m = CARD_META[cid];
          if (m && m.voiceKey && hasLineKey(m.voiceKey)) voice.line(m.voiceKey, { interrupt: true, tag: 'card', maxWait: 2000, subtitle: false });
          activeSlotIdx = (activeSlotIdx + 1) % n;
          render();
        };
        btn.addEventListener('click', pick);
        btn.addEventListener('keydown', /** @param {KeyboardEvent} e */ e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); } });
      });
      root.querySelectorAll('[data-car]').forEach(car => {
        const cIdx = Number(car.getAttribute('data-car'));
        const focusCar = () => {
          activeSlotIdx = cIdx;
          const m = CARD_META[picked[cIdx]];
          if (m && m.voiceKey && hasLineKey(m.voiceKey)) voice.line(m.voiceKey, { interrupt: true, tag: 'card', maxWait: 2000, subtitle: false });
          render();
        };
        car.addEventListener('click', focusCar);

  function interactiveTargets() {
    const scope = uxState.modal ? $('modal') : storyIsOpen() ? $('overlay') : (game.phase === 'studio' ? $('studio') : $('cards'));
    if (!scope) return [];
    const nodes = [...scope.querySelectorAll('[role="button"]:not([data-state="lock"])')];
    return nodes.map(node => {
      const b = node.getBoundingClientRect();
      const s = $('stage').getBoundingClientRect();
      const k = s.width > 0 ? 960 / s.width : 1;
      return { node, pulse: node.classList.contains('ux-pulse'), x: (b.left - s.left) * k, y: (b.top - s.top) * k, w: b.width * k, h: b.height * k };
    }).filter(r => r.w > 10 && r.h > 10);

  function showPadRing(r) {
    const pf = $('padFocus');
    if (!pf) return;
    if (!r) { pf.setAttribute('visibility', 'hidden'); return; }
    const rect = pf.querySelector('rect');
    rect.setAttribute('x', (r.x - 4).toFixed(1)); rect.setAttribute('y', (r.y - 4).toFixed(1));
    rect.setAttribute('width', (r.w + 8).toFixed(1)); rect.setAttribute('height', (r.h + 8).toFixed(1));
    pf.setAttribute('visibility', 'visible');
  }

  function movePadFocus(dir) {
    const list = interactiveTargets();
    if (!list.length) { showPadRing(null); return false; }
    if (padCur < 0 || padCur >= list.length) { padCur = layoutPadStart(list); showPadRing(list[padCur]); return true; }
    const next = layoutPadPick(dir, padCur, list);

    return false;

      if (movePadFocus(dir)) e.preventDefault();

    const nonce = ++playFlow.studioNonce;
    stageState.premiere = true;
    stageState.idx = -1;
    renderStage(game, true);
    uxSfx('premiere');
    setTimeout(() => {
      if (nonce !== playFlow.studioNonce || !canPlay()) return;
      setRecordingAudioMode('premiere');
      recorder.play(blob, () => {
        stageState.premiere = false;
        setLiveVoice(false, 0);
        setRecordingAudioMode('off');
        setStudioWaves(null);
        highlightStudioCard(-1);
        if (nonce === playFlow.studioNonce && canPlay()) {
          stageState.idx = -1;
          renderStage(game, true);
          uxConfetti($('fx'), 480, 220, celebrateNew ? 34 : 20);
          if (celebrateNew) TK.say('rec_done_' + (1 + Math.floor(Math.random() * 3)), { interrupt: true, maxWait: 5000 });
        }
      }, {
        fx: stageState.voiceFx,
        timeline: (meta && meta.timeline) || [],
        onCard: idx => { if (nonce === playFlow.studioNonce) highlightStudioCard(idx); },
        onBars: bars => setStudioWaves(bars),
        onEnergy: energy => setLiveVoice(true, energy),
      });
    }, 480);
  }

  async function runClozeLoop(lv, cards, nonce) {
    for (let i = 0; i < cards.length; i++) {
      if (nonce !== playFlow.studioNonce || !stageState.recording) return;
      highlightStudioCard(i);
      const ms = Math.max(0, Date.now() - playFlow.recStartMs);
      if (i > 0) playFlow.recTimeline.push({ cardIdx: i, ms });
      const relayKey = relayForSlot(lv, i);
      await TK.say(relayKey, { interrupt: true, tag: 'cue', maxWait: 2500, subtitle: false });
      if (nonce !== playFlow.studioNonce || !stageState.recording) return;
      await new Promise(resolve => {
        const done = () => {
          clearTimeout(t);
          if (playFlow.clozeResolve === done) playFlow.clozeResolve = null;
          resolve(undefined);
        };
        const t = setTimeout(done, 5500);
        playFlow.clozeResolve = done;
      });
      if (nonce === playFlow.studioNonce && stageState.recording && i < cards.length - 1) uxSfx('cloze_cue');
    }
    if (nonce === playFlow.studioNonce && stageState.recording) {
      setTimeout(() => { if (nonce === playFlow.studioNonce && stageState.recording) onStudioMicToggle(); }, 600);
    }
  }

  async function onStudioMicToggle() {
    if (!canPlay() || game.phase !== 'studio') return;
    unlockAudio();
    const lv = game.level();
    const nonce = ++playFlow.studioNonce;

    if (stageState.recording) {
      clearInterval(playFlow.studioTimer);
      if (typeof playFlow.clozeResolve === 'function') {
        const r = playFlow.clozeResolve;
        playFlow.clozeResolve = null;
        r();
      }
      highlightStudioCard(-1);
      const res = await recorder.stop();
      stageState.recording = false;
      setLiveVoice(false, 0);
      setRecordingAudioMode('off');
      setStudioWaves(null);
      uxSfx('mic_stop');
      if (res && res.blob) {
        const meta = {
          createdAt: Date.now(),
          durationMs: res.durationMs || 0,
          activeSpeechMs: res.activeSpeechMs || 0,
          tier: save.studioTier || stageState.tier,
          timeline: playFlow.recTimeline.slice(),
        };
        sessionClips.set(lv.id, res.blob);
        sessionMetas.set(lv.id, meta);
        stageState.hasClip = true;
        await recorder.saveClip('room_' + lv.id, res.blob);
        await recorder.saveMeta('room_' + lv.id, meta);
        const firstExisting = await recorder.loadClip('room_' + lv.id + '_first');
        if (!firstExisting) {
          await recorder.saveClip('room_' + lv.id + '_first', res.blob);
          await recorder.saveMeta('room_' + lv.id + '_first', meta);
        }
        save.recordingsCount = (save.recordingsCount || 0) + 1;
        save.speechSamples = (save.speechSamples || 0) + 1;
        save.totalSpeechMs = (save.totalSpeechMs || 0) + (res.activeSpeechMs || 0);
        const rSave = markRoom(lv.id, { recorded: true, stars: [true, true, true] });
        if (!Number.isFinite(rSave.firstSpeechMs)) rSave.firstSpeechMs = res.activeSpeechMs || 0;
        rSave.lastSpeechMs = res.activeSpeechMs || 0;
        rSave.recCount = (rSave.recCount || 0) + 1;
        if ((save.studioTier || stageState.tier) === 'anchor') rSave.tier3 = true;
        saveWrite();
        game.markRecorded();
        audioOnEvents(game.drain());
        playStudioPremiere(lv.id, res.blob, meta, true);
      } else {
        stageState.idx = -1;
        renderStage(game, true);
      }
      return;
    }

    recorder.stopPlay();
    const tier = save.studioTier || stageState.tier || 'cloze';
    stageState.tier = tier;
    setRecordingAudioMode(tier === 'cloze' ? 'rec_cloze' : 'rec_quiet');
    playFlow.recStartMs = Date.now();
    playFlow.recTimeline = [{ cardIdx: 0, ms: 0 }];
    const cards = game.studioCards();
    let clozeBeatBursts = 0;

    const res = await recorder.start(
      frameData => {
        setStudioWaves(frameData.bars);
        setLiveVoice(true, frameData.energy);
        if (tier === 'cloze' && typeof playFlow.clozeResolve === 'function') {
          if (frameData.vad.speechBursts > clozeBeatBursts && frameData.vad.silenceAfterSpeechMs >= 1400) {
            clozeBeatBursts = frameData.vad.speechBursts;
            const r = playFlow.clozeResolve;
            playFlow.clozeResolve = null;
            r();
          }
        } else if (tier !== 'cloze') {
          if (frameData.vad.speechBursts > 0 && frameData.vad.silenceAfterSpeechMs >= 2600 && stageState.activeCardIdx >= 0 && stageState.activeCardIdx + 1 < cards.length) {
            nudgeNextStudioCard(stageState.activeCardIdx + 1);
          }
          if (frameData.vad.activeSpeechMs >= 1500 && frameData.vad.silenceAfterSpeechMs >= 2800 && stageState.recording) {
            onStudioMicToggle();
          }
        }
      },
      () => { if (stageState.recording) onStudioMicToggle(); },
    );
    if (!res.ok) {
      setLiveVoice(false, 0);
      setRecordingAudioMode('off');
      stageState.recording = false;
      setStudioWaves(null);
      game.markDemoHeard();
      renderStage(game, true);
      TK.say('mic_fallback', { interrupt: true, tag: 'demo', maxWait: 6000 }).then(() => {
        if (nonce === playFlow.studioNonce) onStudioDemo(false);
      });
      return;
    }
    stageState.recording = true;
    uxSfx('mic_start');
    stageState.idx = -1;
    renderStage(game, true);
    if (tier === 'cloze') runClozeLoop(lv, cards, nonce);
    else highlightStudioCard(0);
  }

  async function onStudioListen() {
    if (!canPlay() || game.phase !== 'studio' || stageState.recording) return;
    unlockAudio();
    const lv = game.level();
    let blob = sessionClips.get(lv.id);
    if (!blob) blob = await recorder.loadClip('room_' + lv.id);
    if (!blob) { onStudioDemo(false); return; }
    let meta = sessionMetas.get(lv.id);
    if (!meta) meta = await recorder.loadMeta('room_' + lv.id);
    sessionClips.set(lv.id, blob);
    if (meta) sessionMetas.set(lv.id, meta);
    playStudioPremiere(lv.id, blob, meta, false);
  }

  function onStudioDone() {
    if (!canPlay() || game.phase !== 'studio') return;
    stopStudioPlayback();
    if (!game.completeRoom()) return;
    completeRoom(game.index);
  }

  function onHeroTap(who) {
    if (!canPlay() || !who) return;
    unlockAudio();
    game.cheerHero(who);
    uxConfetti($('fx'), who === heroDrawn.leftWho ? 110 : 850, 340, 14);
    const evs = game.drain();
    audioOnEvents(evs);
    talkOnEvents(evs, game);
  }

  function triggerHint() {
    if (!canPlay()) return;
    unlockAudio();
    if (game.phase === 'build') {
      game.hintCard = game.expectedCardId();
      renderStage(game, false);
      uxSfx('tap');
      TK.say('idle_' + (1 + Math.floor(Math.random() * 3)), { interrupt: true, tag: 'hint', maxWait: 3500 });
    } else {
      onStudioDemo(false);
    }
  }

  function completeRoom(lvIdx) {
    const lv = LEVELS[lvIdx];
    playFlow.phase = 'clear';
    const stars = [true, !!(game.demoHeard || game.recorded), !!game.recorded];
    markRoom(lv.id, { cleared: true, recorded: !!game.recorded, stars });
    if (!save.skills) save.skills = { sequence: 0, sentence: 0, classify: 0, reason: 0, twist: 0, episode: 0 };
    save.skills[lv.skill] = Math.min(2, (save.skills[lv.skill] || 0) + 1);
    saveWrite();

    showClear(lvIdx, () => {
      if (lvIdx >= LEVELS.length - 1) showStory(['win', 'end'], () => maybeEyeCareBreak(() => showFinale(showTitle)));
      else maybeEyeCareBreak(() => openRoom(lvIdx + 1));
    });
  }

  let lastT = performance.now(), secAcc = 0;
  function frame(now) {
    const dt = Math.min(.05, (now - lastT) / 1000);
    lastT = now;
    const tSec = now / 1000;
    if (canPlay()) {
      game.step(dt);
      const evs = game.drain();
      if (evs.length) {
        audioOnEvents(evs);
        talkOnEvents(evs, game);
        if (evs.some(e => e.type === 'hint_auto')) renderStage(game, false);
      }
      renderHeroes(game, tSec);
      secAcc += dt;
      if (secAcc >= 1) {
        const inc = Math.floor(secAcc);
        secAcc %= 1;
        save.totalPlaySeconds += inc;
        sessionPlaySec += inc;
        if (sessionPlaySec >= 600) pendingEyeCare = true;
        saveSoon();
      }
    } else if (heroDrawn.built && game.state !== 'play') {
      renderHeroes(game, tSec);
    }
    fxTick(dt, tSec, game);
    audioTick();
    padTick(tSec);
    requestAnimationFrame(frame);
  }

  const titlePlan = assetPlan(LEVELS);
  const qaMode = DEV ? new URLSearchParams(location.search).get('qa') : null;
  if (DEV && qaMode === 'unlock') {
    save.unlocked.rooms = LEVELS.length;
    for (const lv of LEVELS) markRoom(lv.id, { cleared: true, recorded: true, stars: [true, true, true] });
    save.skills = { sequence: 2, sentence: 2, classify: 2, reason: 2, twist: 2, episode: 2 };
    save.recordingsCount = 6;
    save.speechSamples = 6;
    save.totalSpeechMs = 36000;
    save.freeSentences = 4;
  }

  loadArt(titlePlan.title, ART_PATIENCE).then(() => {
    registerOfflineWorker();
    if (DEV && qaMode === 'win') {
      save.unlocked.rooms = LEVELS.length;
      for (const lv of LEVELS) markRoom(lv.id, { cleared: true, recorded: true, stars: [true, true, true] });
      save.skills = { sequence: 2, sentence: 2, classify: 2, reason: 2, twist: 2, episode: 2 };
      showStory(['win', 'end'], () => showFinale(showTitle));
    } else {
      showTitle();
    }
    requestAnimationFrame(frame);
  });
})();
</script>
</body>
